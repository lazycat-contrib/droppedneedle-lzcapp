params:
  - id: timezone
    type: string
    name: Time Zone
    description: IANA time zone such as Etc/UTC, Asia/Shanghai, Europe/London, or America/New_York
    default_value: Etc/UTC
    optional: false

  - id: umask
    type: string
    name: File UMASK
    description: File creation mask; 027 is secure, while 002 permits trusted group writes
    default_value: "027"
    optional: false

locales:
  zh:
    timezone:
      name: 时区
      description: IANA 时区，例如 Etc/UTC、Asia/Shanghai、Europe/London 或 America/New_York
    umask:
      name: 文件 UMASK
      description: 文件创建掩码；027 更安全，002 允许可信用户组写入
  en:
    timezone:
      name: Time Zone
