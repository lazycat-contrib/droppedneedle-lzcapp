params:
  - id: timezone
    type: string
    name: Time Zone
    description: IANA time zone such as Etc/UTC, Asia/Shanghai, Europe/London, or America/New_York
    default_value: Etc/UTC
    optional: false

  - id: umask
    type: string
    name: File UMASK
    description: File creation mask; 027 is secure, while 002 permits trusted group writes
    default_value: "027"
    optional: false

  - id: slskd_downloads_path
    type: string
    name: slskd Downloads Path
    description: Path inside the shared /data mount where slskd completed downloads are visible to DroppedNeedle
    default_value: /data/slskd/complete
    optional: false

locales:
  zh:
    timezone:
      name: 时区
