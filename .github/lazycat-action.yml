version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: droppedneedle

build:
  toolchains: []
  run_buildscript: false

images:
  - id: droppedneedle
    target: service
    service: droppedneedle
    source: docker.io/droppedneedle/droppedneedle
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: DroppedNeedle
    summary: Search MusicBrainz, request albums or tracks, and drive your own slskd or Usenet download client from one container.
